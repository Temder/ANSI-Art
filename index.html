<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>ANSI Art Collection</title>
    <style>
@keyframes slide-up {
    from {
        transform: translateY(calc(100% + 1em));
    }
    to {
        transform: none;
    }
}
@keyframes move-up {
    from {
        transform: translateY(100%);
    }
    to {
        transform: none;
    }
}
html {
    height: 100vh;
}
body {
    --color-main-fg: light-dark(#000, #fff);
    --color-main-bg: light-dark(#eee, #333);
    --color-panel-fg: var(--color-main-fg);
    --color-panel-bg: light-dark(#fff, #000);
    --color-accent: AccentColor;
    --svg-menu: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%203%209%22%3E%3Cpath%20d%3D%22m1.5.5a1%201%200%20000%202%201%201%200%20000-2m0%203a1%201%200%20000%202%201%201%200%20000-2m0%203a1%201%200%20000%202%201%201%200%20000-2%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E');
    --svg-copy: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%208%209%22%3E%3Cpath%20d%3D%22m.5%207.5a1%201%200%20001%201h3a1%201%200%20001-1V3a1%201%200%2000-1-1h-3a1%201%200%2000-1%201zm5-.5h1a1%201%200%20001-1V1.5a1%201%200%2000-1-1h-3a1%201%200%2000-1%201V2%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E');
    --svg-download: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200.25%207%206.75%22%3E%3Cpath%20d%3D%22M3.5.5V5M2%203.5%203.5%205%205%203.5M.5%204.5V5.5A1%201%200%20001.5%206.5H5.5A1%201%200%20006.5%205.5V4.5%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E');
    --svg-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220.25%200.25%209.5%209.5%22%3E%3Cpath%20d%3D%22M1%202Q1%201%202%201H8Q9%201%209%202V8Q9%209%208%209H2Q1%209%201%208ZM1%208%203%205Q3.5%204.25%204%205L5%206.5Q5.5%207.25%206%206.5L6.5%205.75Q7%205%207.5%205.75L9%208M6%202A1%201%200%20006%204%201%201%200%20006%202%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E');
    --svg-ansi: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-0.25%20-0.55%208.6%205.8%22%3E%3Cpath%20d%3D%22M.5%204.2V.5H2V4.2M.5%202.5H2M3%204.2V.2L4.5%204.5V.5M6.7.6H5.5V2.5H6.5V4.1H5.4M7.6.5V4.2%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E');
    --svg-code: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%221.5%201%208%208%22%3E%3Cpath%20d%3D%22M4%203%202.5%204.5Q2%205%202.5%205.5L4%207M5%208.5%206%201.5M7%203%208.5%204.5Q9%205%208.5%205.5L7%207%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E');
    --svg-pixel: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220.5%200.5%206%206%22%3E%3Cpath%20d%3D%22M1%201H2V6H3V1H4V6H5V1H6V2H1V3H6V4H1V5H6V6H1Z%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E');
    --svg-brightness-filter: none;
    min-height: 100vh;
    margin: 0;
    color-scheme: light dark;
    color: var(--color-main-fg);
    background-color: var(--color-main-bg);
    font-family: sans-serif;
    @media (prefers-color-scheme: light) {
        --svg-brightness-filter: brightness(0);
    }
    &[data-scroll="down"] nav {
        transform: translateY(-100%);
    }
    &:has(#nav-creator:checked) #section-creator,
    &:has(#nav-collection:checked) #section-collection {
        display: flex;
    }
    &.drag-over .drop-zone {
        background: repeating-linear-gradient(-45deg, #808080c0, #808080c0 1em, transparent 1em, transparent 2em) !important;
    }
}
* {
    box-sizing: border-box;
}
nav {
    display: flex;
    flex-wrap: wrap;
    position: sticky;
    top: 0.5em;
    margin: 0 auto;
    padding: 0.75em;
    width: fit-content;
    border: solid 2px var(--color-main-fg);
    border-radius: 1em;
    justify-content: center;
    background-color: var(--color-panel-bg);
    z-index: 10;
    transition: transform 0.25s;
    overflow: hidden;
    &::before {
        content: "";
        position: absolute;
        inset: -1em;
        z-index: -1;
    }
    &:hover {
        transform: none !important;
    }
    &:has(:focus-visible) {
        outline: solid 0.2em var(--color-accent);
        outline-offset: -2px;
    }
    & input {
        width: 0;
        margin: 0;
        opacity: 0;
        pointer-events: none;
        &:checked + label {
            background-color: var(--color-main-bg);
        }
    }
    & label {
        display: inline-block;
        padding: 0.5em;
        border-radius: 0.5em;
        align-content: center;
        white-space: nowrap;
        cursor: pointer;
        &:not(:last-child) {
            margin-right: 0.75em;
        }
    }
}
section {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1em;
    padding: 0.5em;
    margin: 0 auto;
    width: 75vw;
}
h1 {
    width: 100%;
    margin: 0.5em 0 0;
}
#art-container {
    width: 100%;
    column-width: clamp(10em, 22vw, 15em);
    & > div {
        --color-art-bg: transparent;
        --color-art-fg: #fff;
        position: relative;
        padding: 0.5em;
        margin-bottom: 1em;
        border-radius: 1em;
        border: solid 2px var(--color-art-fg);
        background-color: var(--color-art-bg);
        &::before {
            content: attr(data-name);
            position: absolute;
            width: calc(100% - 0.5em);
            left: 0;
            bottom: 0;
            padding: 1em 0.25em 0.5em;
            border-radius: 1em;
            text-align: center;
            background: linear-gradient(transparent, var(--color-main-bg) 40%);
            color: var(--color-art-fg);
        }
        &:hover > span, & span:focus-within {
            transform: translateY(calc(100% + 0.5em));
            opacity: 1;
            z-index: 1;
        }
        & canvas {
            width: 100%;
            image-rendering: pixelated;
            border-radius: 0.75em;
        }
        & > div {
            display: flex;
            gap: 0.25em;
            justify-content: end;
            align-items: start;
            position: absolute;
            top: 0.5em;
            right: 0;
            width: 20%;
            aspect-ratio: 1;
            cursor: pointer;
            pointer-events: none;
            overflow-x: visible;
            &::after {
                content: "";
                display: block;
                height: 100%;
                aspect-ratio: 1;
                left: 0;
                background: no-repeat center/70% var(--svg-copy);
                pointer-events: all;
            }
            &:first-of-type {
                anchor-name: --anchor-copy;
            }
            &:last-of-type {
                position-anchor: --anchor-copy;
                top: anchor(110%);
                &::after {
                    background-image: var(--svg-download);
                }
            }
            & > a {
                height: 100%;
                aspect-ratio: 1;
                border-radius: 0.5em;
                background: no-repeat center/70% var(--svg-copy);
                background-color: #00000080;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.5s;
                &:focus-visible {
                    outline: solid 0.2em var(--color-accent);
                }
                &:nth-child(1) {
                    background-image: var(--svg-image);
                    background-size: 80%;
                    transition-delay: 0.3s;
                }
                &:nth-child(2) {
                    background-image: var(--svg-ansi);
                    background-size: 80%;
                    transition-delay: 0.15s;
                }
                &:nth-child(3) {
                    background-image: var(--svg-code);
                    background-size: 80%;
                    transition-delay: 0s;
                }
            }
            &:focus, &:focus-within {
                z-index: 1;
                & > a {
                    opacity: 1;
                    pointer-events: all;
                }
            }
        }
        & > span {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5em;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: fit-content;
            padding-bottom: 0.6em;
            margin: 0 auto;
            border-radius: 1em;
            text-align: center;
            background-color: hsl(from var(--color-main-bg) h s calc(l + 10) / 0.9);
            color: var(--color-art-fg);
            transform: scale(0.5);
            transition: transform 0.5s, opacity 0.5s, z-index 0.3s;
            opacity: 0;
            z-index: -1;
            &::before {
                content: attr(data-width);
            }
            &::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: -1em;
                height: 1em;
            }
            &:has(:focus-visible) {
                outline: solid 0.2em var(--color-accent);
            }
            & > input {
                width: 50%;
                padding: 0.5em;
                border: solid 2px var(--color-art-fg);
                border-radius: 1em;
                vertical-align: middle;
                background-color: var(--color-main-bg);
                &:focus-visible {
                    outline: none;
                }
            }
        }
    }
}
#messages {
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    align-items: end;
    position: absolute;
    right: 0;
    bottom: 0;
    padding: 1em;
    span {
        position: relative;
        width: fit-content;
        padding: 0.5em;
        border: solid 2px light-dark(hsl(from var(--color-message-bg) h s 50%), var(--color-message-bg));
        border-radius: 0.5em;
        background-color: light-dark(var(--color-message-bg), hsl(from var(--color-message-bg) h 90% 50%));
        pointer-events: none;
        &.new {
            animation: slide-up 0.5s;
        }
        &:has(~ .new) {
            animation: move-up 0.5s;
        }
        &::before {
            content: "❌";
            position: absolute;
            top: -1rem;
            right: -1rem;
            width: 2rem;
            height: 2rem;
            text-align: center;
            align-content: center;
            font-size: 1.25em;
            line-height: 1;
            pointer-events: all;
            cursor: pointer;
        }
    }
    .info {
        --color-message-bg: hsl(214, 100%, 93%);
    }
    .warning {
        --color-message-bg: hsl(34, 100%, 93%);
    }
    .error {
        --color-message-bg: hsl(0, 100%, 93%);
    }
}
#section-creator {
    & input[type="file"] {
        opacity: 0;
        width: 0;
        height: 0;
        &:focus-visible + div label {
            outline: solid 0.2em var(--color-accent);
            outline-offset: -2px;
        }
        &:has(+ div canvas[width]):focus-visible + div label {
            background-color: color(from var(--color-main-bg) srgb r g b / 0.75);
            color: var(--color-main-fg);
        }
    }
    & div {
        width: 100%;
        text-align: center;
        &:has(canvas[width][data-opened="image"]) {
            column-width: clamp(15em, 20vw, 100vw);
        }
        & > label {
            position-anchor: --anchor-canvas;
            position: absolute;
            top: anchor(top);
            left: anchor(left);
            right: anchor(right);
            bottom: anchor(bottom);
            padding: 0.25em;
            border-radius: 0.5em;
            align-content: center;
            text-align: center;
            cursor: pointer;
            z-index: 1;
            transition: background-color 0.25s, color 0.25s;
            &.drag-over {
                outline: solid 0.2em var(--color-accent);
                outline-offset: -1px;
            }
            &:has(+ canvas[width]) {
                color: transparent;
                &:hover {
                    background-color: color(from var(--color-main-bg) srgb r g b / 0.75);
                    color: var(--color-main-fg);
                }
            }
        }
        & canvas {
            anchor-name: --anchor-canvas;
            position: relative;
            width: 50%;
            aspect-ratio: 1;
            min-width: 15em;
            max-width: 100%;
            padding: 0.5em;
            border: solid 2px var(--color-main-fg);
            border-radius: 0.5em;
            &[width] {
                aspect-ratio: initial;
                min-width: 0;
                /*background-color: #000;*/
            }
            &[data-opened="ansi"] {
                width: 100%;
                height: 100%;
                max-height: calc(100vh - 15em);
                object-fit: contain;
            }
            &[data-opened="image"] {
                width: 100%;
            }
            &[data-opened="image"] ~ .control-width {
                display: inline-block;
                text-align: center;
            }
            &:has(+ span input:checked) {
                image-rendering: pixelated;
            }
        }
        & .creator-settings {
            position-anchor: --anchor-canvas;
            position: absolute;
            bottom: anchor(top);
            right: anchor(right);
            & input {
                opacity: 0;
                width: 0;
                height: 0;
                margin: 0;
                pointer-events: none;
                &:checked + label {
                    outline: solid 2px var(--color-accent);
                }
            }
            & label {
                display: inline-block;
                width: 2em;
                aspect-ratio: 1;
                border-radius: 1em;
                background: no-repeat center var(--svg-pixel);
                cursor: pointer;
            }
        }
        & .control-width {
            display: none;
            max-width: 100%;
            padding: 0 0.5em;
            border-radius: 0.5em;
            white-space: nowrap;
            &::before {
                content: attr(data-width);
            }
            &:has(:focus-visible) {
                outline: solid 0.25em var(--color-accent);
            }
            & > input {
                max-width: calc(100% - 3em);
                padding: 0.5em;
                border: solid 0.25em var(--color-art-fg);
                border-radius: 1em;
                vertical-align: middle;
                background-color: var(--color-main-bg);
                &:focus-visible {
                    outline: none;
                }
            }
        }
    }
}
.container {
    display: flex;
}
.noselect {
    -webkit-user-select: none;
    user-select: none;
}
    </style>
</head>
<body
  ondragenter="this.classList.add('drag-over')"
  ondragover="this.classList.add('drag-over')"
  ondragleave="this.classList.remove('drag-over')"
  ondrop="this.classList.remove('drag-over')">
    <nav>
        <input type="radio" name="navigation" id="nav-creator" checked><label class="noselect" for="nav-creator">ANSI Art Creator/Viewer</label>
        <input type="radio" name="navigation" id="nav-collection"><label class="noselect" for="nav-collection">ANSI Art Collection</label>
    </nav>
    <div id="messages"></div>
    <datalist id="art-width">
        <option value="15" label="15"></option>
        <option value="30" label="30"></option>
        <option value="45" label="45"></option>
        <option value="60" label="60"></option>
        <option value="75" label="75"></option>
    </datalist>
    <section id="section-creator">
        <h1>ANSI Art Creator/Viewer</h1>
        <input type="file" id="image-input" onchange="createAnsi(this.files[0], 30)" accept="image/png, image/jpeg, .ans, .ansi" />
        <div>
            <label
              for="image-input" class="drop-zone noselect"
              ondragenter="event.preventDefault(); this.classList.add('drag-over')"
              ondragover="event.preventDefault(); this.classList.add('drag-over')"
              ondragleave="this.classList.remove('drag-over')"
              ondrop="event.preventDefault(); this.classList.remove('drag-over'); createAnsi(event.dataTransfer?.files?.[0], 30)"
            >Click to choose an image for conversion or drag and drop it here. ANSI files can be viewed.</label>
            <canvas></canvas>
            <span class="creator-settings">
                <input type="checkbox" id="check-pixelate" checked><label for="check-pixelate"></label>
            </span>
            <span data-width="30" class="control-width">
                <input
                  type="range" list="art-width"
                  value="30" min="15" max="75"
                  oninput="this.parentElement.setAttribute('data-width', this.value);"
                  onchange="createAnsi(null, this.value)" />
            </span>
        </div>
    </section>
    <section id="section-collection">
        <h1>ANSI Art Collection</h1>
        <div id="art-container"></div>
    </section>
    <script src="./image-to-ansi.js"></script>
    <script>
function renderAnsi(ansiString) {
    // Performance optimization: Build HTML in an array rather than string concatenation
    const htmlParts = [];
    let currentFg = '';
    let currentBg = '';
    let buffer = '';
            
    // Helper to escape HTML entities to prevent XSS/breaking layout
    const escapeHtml = (text) => {
        return text.replace(/&/g, '&amp;')
                   .replace(/</g, '&lt;')
                   .replace(/>/g, '&gt;');
    };

    // Helper to convert 256-color ANSI codes to RGB strings
    const get256Color = (n) => {
        if (n < 16) {
            // Standard colors
            const colors = [
                '#000000','#aa0000','#00aa00','#aa5500','#0000aa','#aa00aa','#00aaaa','#aaaaaa',
                '#555555','#ff5555','#55ff55','#ffff55','#5555ff','#ff55ff','#55ffff','#ffffff'
            ];
            return colors[n];
        } else if (n < 232) {
            // 6x6x6 Color Cube
            n -= 16;
            const r = Math.floor(n / 36) * 51;
            const g = Math.floor((n % 36) / 6) * 51;
            const b = (n % 6) * 51;
            return `rgb(${r},${g},${b})`;
        } else {
            // Grayscale ramp
            const gray = (n - 232) * 10 + 8;
            return `rgb(${gray},${gray},${gray})`;
        }
    };

    // Regex to match ANSI escape sequences. 
    // Note: We use (?:\x1b\[|\[) because the user's example is missing the actual 
    // ESC (\x1b) character, which is common when copy-pasting from terminals.
    const regex = /(?:\x1b\[|\[)([0-9;]*)m/g;
    let match;
    let lastIndex = 0;

    while ((match = regex.exec(ansiString)) !== null) {
        // Get the plain text before this escape sequence
        buffer += ansiString.substring(lastIndex, match.index);
        lastIndex = regex.lastIndex;

        // Parse the numbers inside the escape sequence (e.g., "38;2;255;0;0")
        const params = match[1].split(';').map(Number);
        let newFg = currentFg;
        let newBg = currentBg;

        for (let i = 0; i < params.length; i++) {
            const p = params[i];
            if (p === 0) {
                // Reset
                newFg = '';
                newBg = '';
            } else if (p === 38) {
                // Foreground
                if (params[i+1] === 2) {
                    newFg = `rgb(${params[i+2]},${params[i+3]},${params[i+4]})`;
                    i += 4; // Skip the next 4 numbers
                } else if (params[i+1] === 5) {
                    newFg = get256Color(params[i+2]);
                    i += 2;
                }
            } else if (p === 48) {
                // Background
                if (params[i+1] === 2) {
                    newBg = `rgb(${params[i+2]},${params[i+3]},${params[i+4]})`;
                    i += 4; // Skip the next 4 numbers
                } else if (params[i+1] === 5) {
                    newBg = get256Color(params[i+2]);
                    i += 2;
                }
            }
            // Can be expanded to handle bold (1), italic (3), etc.
        }

        // If the colors changed, flush the buffer into a styled span
        if (newFg !== currentFg || newBg !== currentBg) {
            if (buffer.length > 0) {
                const style = `color:${currentFg || 'inherit'};background-color:${currentBg || 'transparent'};`;
                htmlParts.push(`<span style="${style}">${escapeHtml(buffer)}</span>`);
                buffer = '';
            }
            currentFg = newFg;
            currentBg = newBg;
        }
    }

    // Flush any remaining text after the last escape sequence
    buffer += ansiString.substring(lastIndex);
    if (buffer.length > 0) {
        const style = `color:${currentFg || 'inherit'};background-color:${currentBg || 'transparent'};`;
        htmlParts.push(`<span style="${style}">${escapeHtml(buffer)}</span>`);
    }

    return htmlParts.join('');
}

function fixMojibake(s) {
    const b = [];
    for (const c of s) {
        const code = c.codePointAt(0);
        if (code <= 0x7F) b.push(code);
        else if (U2C1252[code] !== undefined) b.push(U2C1252[code]);
        else if (code >= 0xA0 && code <= 0xFF) b.push(code);
        else b.push(0x3F);
    }
    return new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(b));
}

function decCP437(buf) {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += CP437[bytes[i]] || '?';
    return s;
}

function decodeBuf(buf, enc) {
    if (enc === 'cp437') return decCP437(buf);
    const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(buf);
    if (enc === 'utf8') return utf8;
    if (!utf8.includes('\uFFFD')) return utf8;
    const fixed = fixMojibake(utf8);
    if (!fixed.includes('\uFFFD') || fixed !== utf8) return fixed;
    return decCP437(buf);
}

function parseAnsi(text) {
    const grid = [];
    let row = 0, col = 0;
    let fg = { r: 187, g: 187, b: 187 };
    let bg = { r: 0, g: 0, b: 0 };
    let maxC = 0;

    /* SGR color lookup for standard 16 colors */
    const FG16 = {
        30:{r:0,g:0,b:0},31:{r:187,g:0,b:0},32:{r:0,g:187,b:0},33:{r:187,g:187,b:0},
        34:{r:0,g:0,b:187},35:{r:187,g:0,b:187},36:{r:0,g:187,b:187},37:{r:187,g:187,b:187},
        90:{r:85,g:85,b:85},91:{r:255,g:85,b:85},92:{r:85,g:255,b:85},93:{r:255,g:255,b:85},
        94:{r:85,g:85,b:255},95:{r:255,g:85,b:255},96:{r:85,g:255,b:255},97:{r:255,g:255,b:255}
    };
    const BG16 = {
        40:{r:0,g:0,b:0},41:{r:187,g:0,b:0},42:{r:0,g:187,b:0},43:{r:187,g:187,b:0},
        44:{r:0,g:0,b:187},45:{r:187,g:0,b:187},46:{r:0,g:187,b:187},47:{r:187,g:187,b:187},
        100:{r:85,g:85,b:85},101:{r:255,g:85,b:85},102:{r:85,g:255,b:85},103:{r:255,g:255,b:85},
        104:{r:85,g:85,b:255},105:{r:255,g:85,b:255},106:{r:85,g:255,b:255},107:{r:255,g:255,b:255}
    };

    function applySGR(p) {
        let i = 0;
        while (i < p.length) {
            const v = p[i];
            if (v === 0) { fg = {r:187,g:187,b:187}; bg = {r:0,g:0,b:0}; }
            else if (v === 39) fg = {r:187,g:187,b:187};
            else if (v === 49) bg = {r:0,g:0,b:0};
            else if (v === 38 && p[i+1] === 2 && i+4 < p.length) { fg = {r:p[i+2],g:p[i+3],b:p[i+4]}; i+=4; }
            else if (v === 48 && p[i+1] === 2 && i+4 < p.length) { bg = {r:p[i+2],g:p[i+3],b:p[i+4]}; i+=4; }
            else if (v === 38 && p[i+1] === 5 && i+2 < p.length) { /* 256-color fg — skip */ i+=2; }
            else if (v === 48 && p[i+1] === 5 && i+2 < p.length) { /* 256-color bg — skip */ i+=2; }
            else if (FG16[v]) fg = { ...FG16[v] };
            else if (BG16[v]) bg = { ...BG16[v] };
            i++;
        }
    }

    function parseCSI(from) {
        let i = from, params = [], cur = '';
        while (i < text.length) {
            const c = text[i];
            if (c >= '0' && c <= '9') { cur += c; }
            else if (c === ';') { params.push(cur === '' ? 0 : parseInt(cur, 10)); cur = ''; }
            else if (c === 'm') {
                params.push(cur === '' ? 0 : parseInt(cur, 10));
                applySGR(params);
                return i + 1;
            }
            else if (c === 'H' || c === 'f') {
                params.push(cur === '' ? 0 : parseInt(cur, 10));
                row = Math.max(0, (params[0] || 1) - 1);
                col = Math.max(0, (params[1] || 1) - 1);
                return i + 1;
            }
            else if (c === 'A') { row = Math.max(0, row - (parseInt(cur) || 1)); return i + 1; }
            else if (c === 'B') { row += (parseInt(cur) || 1); return i + 1; }
            else if (c === 'C') { col += (parseInt(cur) || 1); return i + 1; }
            else if (c === 'D') { col = Math.max(0, col - (parseInt(cur) || 1)); return i + 1; }
            else {
                /* Unknown CSI — skip to terminator */
                while (i < text.length && !/[a-zA-Z]/.test(text[i])) i++;
                return i + 1;
            }
            i++;
        }
        return i;
    }

    /* Loose detection: bare [ that looks like a CSI sequence */
    function looksLikeCSI(idx) {
        if (text[idx] !== '[') return false;
        let j = idx + 1;
        if (j >= text.length) return false;
        if (!/[\d;]/.test(text[j])) return false;
        while (j < text.length && j - idx < 50) {
            if (/[a-zA-Z]/.test(text[j])) return true;
            if (!/[\d;]/.test(text[j])) return false;
            j++;
        }
        return false;
    }

    let i = 0;
    while (i < text.length) {
        // Read a Unicode code point, rather than a UTF-16 code unit. The
        // fractional block glyphs in U+1FB80 are astral characters.
        const ch = String.fromCodePoint(text.codePointAt(i));
        /* ESC [ sequence */
        if (ch === '\x1b' && i + 1 < text.length && text[i + 1] === '[') {
            i = parseCSI(i + 2); continue;
        }
        /* Loose bare-[ sequence */
        if (ch === '[' && looksLikeCSI(i)) {
            i = parseCSI(i + 1); continue;
        }
        if (ch === '\n') { row++; col = 0; i++; continue; }
        if (ch === '\r') { col = 0; i++; continue; }
        if (ch === '\t') { col = Math.ceil((col + 1) / 8) * 8; i++; continue; }
        if (ch === '\x08') { col = Math.max(0, col - 1); i++; continue; }

        /* Output character */
        if (!grid[row]) grid[row] = [];
        grid[row][col] = { ch, fg: { ...fg }, bg: { ...bg } };
        col++;
        if (col > maxC) maxC = col;
        i += ch.length;
    }
    /* Trim empty trailing rows */
    while (grid.length && (!grid[grid.length - 1] || grid[grid.length - 1].length === 0)) grid.pop();
    return { grid, rows: grid.length, cols: maxC };
}

function render(cvs, ctx, grid, rows, cols) {
    let curGrid = grid; let curRows = rows; let curCols = cols;
    const W = cols * CW, H = rows * CH;
    cvs.width = W; cvs.height = H;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#00000000';
    ctx.fillRect(0, 0, W, H);
    ctx.font = CH + 'px "Fira Code","Courier New",monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';

    for (let r = 0; r < rows; r++) {
        const row = grid[r];
        if (!row) continue;
        for (let c = 0; c < row.length; c++) {
            const cell = row[c];
            if (!cell) continue;
            const x = c * CW, y = r * CH;

            /* Background */
            ctx.fillStyle = 'rgb(' + cell.bg.r + ',' + cell.bg.g + ',' + cell.bg.b + ')';
            if (cell.bg.r != 0 && cell.bg.g != 0 && cell.bg.b != 0) {
                ctx.fillRect(x, y, CW, CH);
            }

            /* Foreground character */
            const bt = BLOCKS[cell.ch];
            if (bt) {
                drawBlock(ctx, x, y, bt, cell.fg);
            } else if (cell.ch !== ' ') {
                ctx.fillStyle = 'rgb(' + cell.fg.r + ',' + cell.fg.g + ',' + cell.fg.b + ')';
                ctx.fillText(cell.ch, x + CW / 2, y);
            }
        }
    }
}

function drawBlock(ctx, x, y, type, fg) {
    const c = 'rgb(' + fg.r + ',' + fg.g + ',' + fg.b + ')';
    ctx.fillStyle = c;
    const hw = CW >> 1, hh = CH >> 1;
    const fraction = /^(upper|lower)([1-7])$/.exec(type);
    if (fraction) {
        const height = Math.round(CH * Number(fraction[2]) / 8);
        ctx.fillRect(x, fraction[1] === 'upper' ? y : y + CH - height, CW, height);
        return;
    }
    switch (type) {
        case 'full':  ctx.fillRect(x, y, CW, CH); break;
        case 'upper': ctx.fillRect(x, y, CW, hh); break;
        case 'lower': ctx.fillRect(x, y + hh, CW, hh); break;
        case 'left':  ctx.fillRect(x, y, hw, CH); break;
        case 'right': ctx.fillRect(x + hw, y, hw, CH); break;
        case 'shade1': /* 25% checkerboard */
            for (let py = 0; py < CH; py += 2)
                for (let px = (py / 2) % 2; px < CW; px += 2)
                    ctx.fillRect(x + px, y + py, 1, 1);
            break;
        case 'shade2': /* 50% checkerboard */
            for (let py = 0; py < CH; py++)
                for (let px = (py % 2); px < CW; px += 2)
                    ctx.fillRect(x + px, y + py, 1, 1);
            break;
        case 'shade3': /* 75% — inverse of 25% */
            ctx.fillRect(x, y, CW, CH);
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            for (let py = 0; py < CH; py += 2)
                for (let px = (py / 2) % 2; px < CW; px += 2)
                    ctx.fillRect(x + px, y + py, 1, 1);
            break;
    }
}


async function createAnsi(image, width) {
    document.querySelector('.control-width').setAttribute('data-width', parseInt(width));
    document.querySelector('.control-width input').value = parseInt(width);
    let ansi;
    if (image && (image.name.toLowerCase().endsWith('.ans') || image.name.toLowerCase().endsWith('.ansi'))) {
        creatorCanvas.setAttribute('data-opened', 'ansi');
        ansi = await image.text();
    } else if (image && image.type.startsWith('image') || creatorImage) {
        creatorCanvas.setAttribute('data-opened', 'image');
        if (image) {
            creatorImage = image;
        } else {
            image = creatorImage;
        }
        ansi = await imageToAnsi(URL.createObjectURL(image), parseInt(width), undefined, true);
        ansi = ansi.replaceAll('\\x1b', '');
    } else {
        displayMessage('warning', 'Only images and .ans/.ansi files are allowed!');
        console.log(image)
        return;
    }

    let cvs = creatorCanvas;
    let ctx = cvs.getContext('2d', { willReadFrequently: false });
    const { grid, rows, cols } = parseAnsi(ansi);
    render(cvs, ctx, grid, rows, cols);
}

async function changeAnsi(name, width, bgcolor) {
    let ansi = await imageToAnsi(`./ANSI Art/${name}/image.png`, parseInt(width), bgcolor, true);

    ansiArt[name]['ansi_code'] = ansi;
    ansi = ansi.replaceAll('\\x1b', '');
    ansiArt[name]['ansi_file'] = ansi;

    let container = document.querySelector(`[data-name="${name}"]`);
    if (bgcolor) {
        container.style.setProperty('--color-art-bg', bgcolor);
    }
    let cvs = container.getElementsByTagName('canvas')[0];
    let ctx = cvs.getContext('2d', { willReadFrequently: false });
    const { grid, rows, cols } = parseAnsi(ansi);
    render(cvs, ctx, grid, rows, cols);
}

async function downloadAs(type, name) {
    let canvas = document.querySelector(`[data-name="${name}"] canvas`);
    let file_ext = type == 'image' ? 'png' : type == 'ansi' ? 'ans' : 'sh';
    let blob;
    if (type === 'image') {
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    } else if (type === 'ansi') {
        blob = new Blob([ansiArt[name].ansi_file], {
            type: 'text/plain;charset=utf-8'
        });
    } else if (type === 'code') {
        blob = new Blob([`printf '%b\n' '${ansiArt[name].ansi_code}'`], {
            type: 'text/plain;charset=utf-8'
        });
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}.${file_ext}`;
    a.click();
    a.remove();
}

async function copyAs(type, name) {
    const canvas = document.querySelector(`[data-name="${name}"] canvas`);
    let clipItem;

    if (type === 'image') {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        clipItem = new ClipboardItem({ [blob.type]: blob });
    } else if (type === 'ansi') {
        clipItem = new ClipboardItem({
            'text/plain': new Blob([ansiArt[name].ansi_file], { type: 'text/plain' })
        });
    } else if (type === 'code') {
        clipItem = new ClipboardItem({
            'text/plain': new Blob([`printf '%b\n' '${ansiArt[name].ansi_code}'`], { type: 'text/plain' })
        });
    }

    if (clipItem) {
        await navigator.clipboard.write([clipItem]);
        console.log('Copied');
    }
}

function displayMessage(type, message) {
    messageContainer.insertAdjacentHTML('beforeend', /*html*/`
        <span class="${type} new" onclick="this.remove()">${message}</span>
    `);
    setTimeout(() => { messageContainer.children[messageContainer.children.length - 1].classList.remove('new') }, 500);
}

    ' !"#$%&\'()*+,-./0123456789:;<=>?' +

    '`abcdefghijklmnopqrstuvwxyz{|}~\x7f' +

    '\u2567\u2568\u2564\u256a\u256b\u2593\u2518\u250c\u2588\u2584\u258c\u2590\u2580' +
    '\u03b1\u00df\u0393\u03c0\u03a3\u03c3\u03bc\u03c4\u03a6\u0398\u03a9\u03b4\u221e\u03c6\u03b5\u2229' +

    const map = {};
    for (let i = 0; i < 256; i++) map[i] = t[i];

})();

const container = document.getElementById('art-container');
const creatorCanvas = document.querySelector('#section-creator canvas');
const messageContainer = document.querySelector('#messages');

let CW = 8, CH = 16;
let creatorImage;
let ansiArt = {};

document.fonts.ready.then(() => {
    requestAnimationFrame(async () => {
        fetch('./paths.json')
        .then(r => r.text())
        .then(text => {
            JSON.parse(text).forEach(async path => {
                ansiArt[path] = {};
                ansiArt[path]['image_path'] = `./ANSI Art/${path}/image.png`;
                let initial_width = 30;
                let ansi = await imageToAnsi(`./ANSI Art/${path}/image.png`, initial_width, undefined, true);
                ansiArt[path]['ansi_code'] = ansi;
                ansi = ansi.replaceAll('\\x1b', '');
                ansiArt[path]['ansi_file'] = ansi;

                let cvs = document.createElement('canvas');
                let ctx = cvs.getContext('2d', { willReadFrequently: false });
                const { grid, rows, cols } = parseAnsi(ansi);
                render(cvs, ctx, grid, rows, cols);

                container.insertAdjacentHTML('beforeend', /*html*/`
                <div data-name="${path}" tabindex="-1">
                    <div tabindex="-1">
                        <a href="javascript:copyAs('image', '${path}')"></a>

                        <a href="javascript:copyAs('code', '${path}')"></a>
                    </div>
                    <div tabindex="-1">
                        <a href="javascript:downloadAs('image', '${path}')"></a>
                        <a href="javascript:downloadAs('ansi', '${path}')"></a>
                        <a href="javascript:downloadAs('code', '${path}')"></a>
                    </div>
                    <span data-width="${initial_width}">
                        <input type="range" list="art-width" value="30" min="15" max="75" 
                               oninput="this.parentElement.setAttribute('data-width', this.value);"
                               onchange="changeAnsi(this.parentElement.parentElement.getAttribute('data-name'), this.value)" />
                        <input type="color"
                               onchange="changeAnsi(this.parentElement.parentElement.getAttribute('data-name'), this.previousElementSibling.value, this.value)" />
                    </span>
                </div>`);
                container.lastElementChild.insertAdjacentElement('afterbegin', cvs);
            });
        })
    })
})

window.onscroll = function(e) {
    if (this.oldScroll > this.scrollY) {
        document.body.setAttribute('data-scroll', 'up')
    } else {
        if (this.scrollY > 30) {
            document.body.setAttribute('data-scroll', 'down')
        }
    }
    this.oldScroll = this.scrollY;
}
