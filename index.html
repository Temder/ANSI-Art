<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>ANSI Art Collection</title>
    <style>
@font-face {
    font-family: Adwaita;
    src: url(Fonts/Adwaita_Mono/adwaita-mono-latin-400-normal.ttf);
}
@keyframes slide-up {
    from {
        transform: translateY(calc(100% + 1em));
    }
    to {
        transform: none;
    }
}
@keyframes move-up {
    from {
        transform: translateY(100%);
    }
    to {
        transform: none;
    }
}
html {
    height: 100vh;
}
body {
    --color-main-fg: light-dark(#000, #fff);
    --color-main-bg: light-dark(#eee, #333);
    --color-panel-fg: var(--color-main-fg);
    --color-panel-bg: light-dark(#fff, #000);
    --color-accent: AccentColor;
    --svg-menu: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%203%209%22%3E%3Cpath%20d%3D%22m1.5.5a1%201%200%20000%202%201%201%200%20000-2m0%203a1%201%200%20000%202%201%201%200%20000-2m0%203a1%201%200%20000%202%201%201%200%20000-2%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E');
    --svg-copy: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%208%209%22%3E%3Cpath%20d%3D%22m.5%207.5a1%201%200%20001%201h3a1%201%200%20001-1V3a1%201%200%2000-1-1h-3a1%201%200%2000-1%201zm5-.5h1a1%201%200%20001-1V1.5a1%201%200%2000-1-1h-3a1%201%200%2000-1%201V2%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E');
    --svg-download: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200.25%207%206.75%22%3E%3Cpath%20d%3D%22M3.5.5V5M2%203.5%203.5%205%205%203.5M.5%204.5V5.5A1%201%200%20001.5%206.5H5.5A1%201%200%20006.5%205.5V4.5%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E');
    --svg-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220.25%200.25%209.5%209.5%22%3E%3Cpath%20d%3D%22M1%202Q1%201%202%201H8Q9%201%209%202V8Q9%209%208%209H2Q1%209%201%208ZM1%208%203%205Q3.5%204.25%204%205L5%206.5Q5.5%207.25%206%206.5L6.5%205.75Q7%205%207.5%205.75L9%208M6%202A1%201%200%20006%204%201%201%200%20006%202%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E');
    --svg-ansi: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-0.25%20-0.55%208.6%205.8%22%3E%3Cpath%20d%3D%22M.5%204.2V.5H2V4.2M.5%202.5H2M3%204.2V.2L4.5%204.5V.5M6.7.6H5.5V2.5H6.5V4.1H5.4M7.6.5V4.2%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E');
    --svg-code: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%221.5%201%208%208%22%3E%3Cpath%20d%3D%22M4%203%202.5%204.5Q2%205%202.5%205.5L4%207M5%208.5%206%201.5M7%203%208.5%204.5Q9%205%208.5%205.5L7%207%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%220.75%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E');
    --svg-pixel: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220.5%200.5%206%206%22%3E%3Cpath%20d%3D%22M1%201H2V6H3V1H4V6H5V1H6V2H1V3H6V4H1V5H6V6H1Z%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E');
    --svg-brightness-filter: none;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    color-scheme: light dark;
    color: var(--color-main-fg);
    background-color: var(--color-main-bg);
    font-family: sans-serif;
    hyphens: auto;
    @media (prefers-color-scheme: light) {
        --svg-brightness-filter: brightness(0);
    }
    &[data-scroll="down"] nav {
        transform: translateY(-100%);
    }
    &:has(#nav-creator:checked) #section-creator,
    &:has(#nav-collection:checked) #section-collection {
        display: flex;
    }
    &.drag-over .drop-zone {
        background: repeating-linear-gradient(-45deg, #808080c0, #808080c0 1em, transparent 1em, transparent 2em) !important;
    }
}
* {
    box-sizing: border-box;
}
nav {
    display: flex;
    flex-wrap: wrap;
    position: sticky;
    top: 0.5em;
    padding: 0.75em;
    margin: 0 auto;
    width: fit-content;
    max-width: calc(100% - 1em);
    border: solid 2px var(--color-main-fg);
    border-radius: 1em;
    justify-content: center;
    background-color: var(--color-panel-bg);
    text-align: center;
    z-index: 10;
    transition: transform 0.25s;
    &::before {
        content: "";
        position: absolute;
        inset: -1em -0.5em;
        z-index: -1;
    }
    &:hover {
        transform: none !important;
    }
    &:has(:focus-visible) {
        outline: solid 0.2em var(--color-accent);
        outline-offset: -2px;
    }
    & input {
        width: 0;
        height: 0;
        margin: 0;
        opacity: 0;
        pointer-events: none;
        &:checked + label {
            background-color: var(--color-main-bg);
        }
    }
    & label {
        display: inline-block;
        padding: 0.5em;
        border-radius: 0.5em;
        align-content: center;
        cursor: pointer;
    }
}
section {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1em;
    flex-grow: 1;
    padding: 0.5em;
    margin: 0 auto;
    width: clamp(75vw, 100vh, 100vw);
}
h1 {
    width: 100%;
    margin: 0.5em 0 0;
}
#art-container {
    width: 100%;
    column-width: clamp(10em, 22vw, 15em);
    & > div {
        --color-art-bg: transparent;
        --color-art-fg: #fff;
        position: relative;
        padding: 0.5em;
        margin-bottom: 1em;
        border-radius: 1em;
        border: solid 2px var(--color-art-fg);
        background-color: var(--color-art-bg);
        &::before {
            content: attr(data-name);
            position: absolute;
            width: calc(100% - 0.5em);
            left: 0;
            bottom: 0;
            padding: 1em 0.25em 0.5em;
            border-radius: 1em;
            text-align: center;
            background: linear-gradient(transparent, var(--color-main-bg) 40%);
            color: var(--color-art-fg);
        }
        &:hover > span, & span:focus-within {
            transform: translateY(calc(100% + 0.5em));
            opacity: 1;
            z-index: 1;
        }
        & canvas {
            width: 100%;
            image-rendering: pixelated;
            border-radius: 0.75em;
        }
        & > div {
            display: flex;
            gap: 0.25em;
            justify-content: end;
            align-items: start;
            position: absolute;
            top: 0.5em;
            right: 0;
            width: 20%;
            aspect-ratio: 1;
            cursor: pointer;
            pointer-events: none;
            overflow-x: visible;
            &::after {
                content: "";
                display: block;
                height: 100%;
                aspect-ratio: 1;
                left: 0;
                background: no-repeat center/70% var(--svg-copy);
                pointer-events: all;
            }
            &:first-of-type {
                anchor-name: --anchor-copy;
            }
            &:last-of-type {
                position-anchor: --anchor-copy;
                top: anchor(110%);
                &::after {
                    background-image: var(--svg-download);
                }
            }
            &:focus, &:focus-within {
                z-index: 1;
                & > a {
                    opacity: 1;
                    pointer-events: all;
                }
            }
        }
        & > span {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5em;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: fit-content;
            padding-bottom: 0.6em;
            margin: 0 auto;
            border-radius: 1em;
            text-align: center;
            background-color: hsl(from var(--color-main-bg) h s calc(l + 10) / 0.9);
            color: var(--color-art-fg);
            transform: scale(0.5);
            transition: transform 0.5s, opacity 0.5s, z-index 0.3s;
            opacity: 0;
            z-index: -1;
            &::before {
                content: attr(data-width);
            }
            &::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: -1em;
                height: 1em;
            }
            &:has(:focus-visible) {
                outline: solid 0.2em var(--color-accent);
            }
            & > input {
                width: 50%;
                padding: 0.5em;
                border: solid 2px var(--color-art-fg);
                border-radius: 1em;
                vertical-align: middle;
                background-color: var(--color-main-bg);
                &:focus-visible {
                    outline: none;
                }
            }
        }
    }
}
#messages {
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    align-items: end;
    position: absolute;
    right: 0;
    bottom: 0;
    padding: 1em;
    z-index: 10;
    span {
        position: relative;
        width: fit-content;
        padding: 0.5em;
        border: solid 2px light-dark(hsl(from var(--color-message-bg) h s 50%), var(--color-message-bg));
        border-radius: 0.5em;
        background-color: light-dark(var(--color-message-bg), hsl(from var(--color-message-bg) h 90% 50%));
        pointer-events: none;
        &.new {
            animation: slide-up 0.5s;
        }
        &:has(~ .new) {
            animation: move-up 0.5s;
        }
        &::before {
            content: "❌";
            position: absolute;
            top: -1rem;
            right: -1rem;
            width: 2rem;
            height: 2rem;
            text-align: center;
            align-content: center;
            font-size: 1.25em;
            line-height: 1;
            pointer-events: all;
            cursor: pointer;
        }
    }
    .info {
        --color-message-bg: hsl(214, 100%, 93%);
    }
    .warning {
        --color-message-bg: hsl(34, 100%, 93%);
    }
    .error {
        --color-message-bg: hsl(0, 100%, 93%);
    }
}
#section-creator {
    /* height: clamp(25em, calc(100vh - 4em), 100vh); */
    & input[type="file"] {
        opacity: 0;
        width: 0;
        height: 0;
        &:focus-visible + div label {
            outline: solid 0.2em var(--color-accent);
            outline-offset: -2px;
        }
        &:has(+ div canvas[width]):focus-visible + div label {
            background-color: color(from var(--color-main-bg) srgb r g b / 0.75);
            color: var(--color-main-fg);
        }
    }
    & > div {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        gap: 2em;
        flex-grow: 1;
        width: 100%;
        /* height: 100%; */
        &:has(canvas[width]) {
            &:has([data-opened="image"]) {
                row-gap: 4em;
                & .control-width {
                    display: inline-block;
                }
            }
            &:has(#check-pixelate:checked) canvas {
                image-rendering: pixelated;
            }
            & .download-copy {
                display: flex;
            }
        }
        & > label {
            position-anchor: --anchor-canvas;
            position: absolute;
            top: anchor(top);
            left: anchor(left);
            right: anchor(right);
            bottom: anchor(bottom);
            padding: 0.25em;
            border-radius: 0.5em;
            align-content: center;
            text-align: center;
            cursor: pointer;
            z-index: 1;
            transition: background-color 0.25s, color 0.25s;
            overflow: scroll;
            &.drag-over {
                outline: solid 0.2em var(--color-accent);
                outline-offset: -1px;
            }
            &:has(+ #canvas-container canvas[width]) {
                color: transparent;
                &:hover {
                    background-color: color(from var(--color-main-bg) srgb r g b / 0.75);
                    color: var(--color-main-fg);
                    z-index: 1;
                }
            }
        }
        & #canvas-container:has([width]) {
            position: relative;
            flex-grow: 0.2;
            margin-right: calc(2em + 2px);
            text-align: center;
            &::before {
                content: "Opened: " attr(data-opened);
                position-anchor: --anchor-canvas;
                position: absolute;
                left: anchor(left);
                right: anchor(right);
                bottom: anchor(top);
                padding: 0.5em;
                border-radius: 1em;
                text-align: start;
                color: var(--color-art-fg);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                z-index: 1;
            }
        }
        & canvas {
            anchor-name: --anchor-canvas;
            position: relative;
            width: clamp(10vw, 50vh, 100%);
            height: min-content;
            aspect-ratio: 1;
            min-width: 5em;
            padding: 0.5em;
            margin: 0 auto;
            outline: solid 2px var(--color-main-fg);
            border-radius: 0.5em;
            &[width] {
                aspect-ratio: initial;
            }
        }
        & .creator-settings {
            position-anchor: --anchor-canvas;
            position: absolute;
            top: anchor(top);
            left: calc(anchor(right) + 0.2em);
            z-index: 1;
            & input {
                opacity: 0;
                width: 0;
                height: 0;
                margin: 0;
                pointer-events: none;
                &:checked + label {
                    outline: solid 2px var(--color-accent);
                }
            }
            & label {
                display: inline-block;
                width: 2em;
                aspect-ratio: 1;
                border-radius: 0.5em;
                background: no-repeat center var(--svg-pixel);
                cursor: pointer;
            }
        }
        & .download-copy {
            display: none;
            flex-direction: column;
            gap: 0.2em;
            & a {
                display: inline-block;
                width: 2.5em;
                height: 2.5em;
                opacity: 1;
                pointer-events: all;
                & + span {
                    margin-top: 0.5em;
                }
            }
            & h2 {
                margin-top: 0;
            }
            & span {
                text-align: center;
            }
        }
        & .control-width {
            position-anchor: --anchor-canvas;
            position: absolute;
            top: calc(anchor(bottom) + 0.2em);
            left: anchor(left);
            right: anchor(right);
            display: none;
            max-width: 100%;
            padding: 0 0.5em;
            border-radius: 0.5em;
            white-space: nowrap;
            text-align: center;
            &::before {
                content: attr(data-width);
            }
            &:has(:focus-visible) {
                outline: solid 0.25em var(--color-accent);
            }
            & > input {
                max-width: calc(100% - 3em);
                padding: 0.5em;
                border: solid 0.25em var(--color-art-fg);
                border-radius: 1em;
                vertical-align: middle;
                background-color: var(--color-main-bg);
                &:focus-visible {
                    outline: none;
                }
            }
        }
    }
}
#section-collection {
    padding-bottom: 6em;
}
.container {
    display: flex;
}
a.download {
    height: 100%;
    aspect-ratio: 1;
    border-radius: 0.5em;
    background: no-repeat center/70% var(--svg-copy);
    background-color: #00000080;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
    &:focus-visible {
        outline: solid 0.2em var(--color-accent);
    }
    &.image {
        background-image: var(--svg-image);
        background-size: 80%;
        transition-delay: 0.3s;
    }
    &.ansi {
        background-image: var(--svg-ansi);
        background-size: 80%;
        transition-delay: 0.15s;
    }
    &.code {
        background-image: var(--svg-code);
        background-size: 80%;
        transition-delay: 0s;
    }
}
.noselect {
    -webkit-user-select: none;
    user-select: none;
}
    </style>
</head>
<body
  ondragenter="this.classList.add('drag-over')"
  ondragover="this.classList.add('drag-over')"
  ondragleave="this.classList.remove('drag-over')"
  ondrop="this.classList.remove('drag-over')">
    <nav>
        <input type="radio" name="navigation" id="nav-creator" checked><label class="noselect" for="nav-creator">ANSI Art Creator/Viewer</label>
        <input type="radio" name="navigation" id="nav-collection"><label class="noselect" for="nav-collection">ANSI Art Collection</label>
    </nav>
    <div id="messages"></div>
    <datalist id="art-width">
        <option value="15" label="15"></option>
        <option value="30" label="30"></option>
        <option value="45" label="45"></option>
        <option value="60" label="60"></option>
        <option value="75" label="75"></option>
    </datalist>
    <section id="section-creator">
        <h1>ANSI art creator/viewer</h1>
        <input type="file" id="image-input" onchange="createAnsi(this.files[0], 30)" accept="image/png, image/jpeg, .ans, .ansi" />
        <div data-name="ansi-creator">
            <label
              for="image-input" class="drop-zone noselect"
              ondragenter="event.preventDefault(); this.classList.add('drag-over')"
              ondragover="event.preventDefault(); this.classList.add('drag-over')"
              ondragleave="this.classList.remove('drag-over')"
              ondrop="event.preventDefault(); this.classList.remove('drag-over'); createAnsi(event.dataTransfer?.files?.[0] || event.dataTransfer.getData('URL'), 30)"
            >Click to choose an image for conversion or drag and drop it here. ANSI files can be viewed.</label>
            <div id="canvas-container">
                <canvas></canvas>
            </div>
            <span class="creator-settings">
                <input type="checkbox" id="check-pixelate" checked><label for="check-pixelate"></label>
            </span>
            <span data-width="30" class="control-width">
                <input
                  type="range" list="art-width"
                  value="30" min="15" max="75"
                  oninput="this.parentElement.setAttribute('data-width', this.value);"
                  onchange="createAnsi(null, this.value)" />
            </span>
            <span class="download-copy">
                <span>Copy as</span>
                <span>
                    <a class="download image" href="javascript:copyAs('image', 'ansi-creator')"></a>
                    <a class="download ansi" href="javascript:copyAs('ansi', 'ansi-creator')"></a>
                    <a class="download code" href="javascript:copyAs('code', 'ansi-creator')"></a>
                </span>
                <span>Download as</span>
                <span>
                    <a class="download image" href="javascript:downloadAs('image', 'ansi-creator')"></a>
                    <a class="download ansi" href="javascript:downloadAs('ansi', 'ansi-creator')"></a>
                    <a class="download code" href="javascript:downloadAs('code', 'ansi-creator')"></a>
                </span>
            </span>
        </div>
    </section>
    <section id="section-collection">
        <h1>ANSI art collection</h1>
        <div id="art-container"></div>
    </section>
    <script src="./ansi-functions.js"></script>
    <script>
async function createAnsi(object, width) {
    document.querySelector('.control-width').setAttribute('data-width', parseInt(width));
    document.querySelector('.control-width input').value = parseInt(width);
    let ansi;
    if (object && object.name && (object.name.toLowerCase().endsWith('.ans') || 
                                  object.name.toLowerCase().endsWith('.ansi'))) { // ANSI file
        ansi = await object.text();
        creatorCanvas.setAttribute('data-opened', 'ansi');
    } else {
        let image = object ?? creatorImage;

        if (typeof image === 'string') { // URL dropped from a webpage
            try {
                const response = await fetch(image);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                image = await response.blob();
            } catch (error) {
                return displayMessage('warning', 'The image could not be loaded. Please try downloading it first.');
            }
        }
        if (!(image instanceof Blob) || (image.type && !image.type.startsWith('image/'))) {
            return displayMessage('warning', 'Only images and .ans/.ansi files are allowed!');
        }

        // Always retain a Blob, never the dropped URL, so width changes can re-render it.
        creatorImage = image;
        const imageUrl = URL.createObjectURL(image);
        try {
            ansi = await imageToAnsi(imageUrl, parseInt(width), undefined, true);
        } finally {
            URL.revokeObjectURL(imageUrl);
        }
        creatorCanvas.setAttribute('data-opened', 'image');
    }
    if (object) {
        document.getElementById('canvas-container').setAttribute('data-opened', object.name || object);
    }

    ansiArt['ansi-creator'] = {}
    ansiArt['ansi-creator']['ansi_code'] = ansi;
    ansi = ansi.replaceAll('\\x1b', '');
    ansiArt['ansi-creator']['ansi_file'] = ansi;

    renderAnsi(creatorCanvas, ansi);
}

async function changeAnsi(name, width, bgcolor) {
    let ansi = await imageToAnsi(`./ANSI Art/${name}/image.png`, parseInt(width), bgcolor, true);

    ansiArt[name]['ansi_code'] = ansi;
    ansi = ansi.replaceAll('\\x1b', '');
    ansiArt[name]['ansi_file'] = ansi;

    let container = document.querySelector(`[data-name="${name}"]`);
    if (bgcolor) {
        container.style.setProperty('--color-art-bg', bgcolor);
    }
    renderAnsi(container.getElementsByTagName('canvas')[0], ansi);
}

async function downloadAs(type, name) {
    let canvas = document.querySelector(`[data-name="${name}"] canvas`);
    let file_ext = type == 'image' ? 'png' : type == 'ansi' ? 'ans' : 'sh';
    let blob;
    if (type === 'image') {
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    } else if (type === 'ansi') {
        blob = new Blob([ansiArt[name].ansi_file], {
            type: 'text/plain;charset=utf-8'
        });
    } else if (type === 'code') {
        blob = new Blob([`printf '%b\n' '${ansiArt[name].ansi_code}'`], {
            type: 'text/plain;charset=utf-8'
        });
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}.${file_ext}`;
    a.click();
    a.remove();
}

async function copyAs(type, name) {
    const canvas = document.querySelector(`[data-name="${name}"] canvas`);
    let clipItem;

    if (type === 'image') {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        clipItem = new ClipboardItem({ [blob.type]: blob });
    } else if (type === 'ansi') {
        clipItem = new ClipboardItem({
            'text/plain': new Blob([ansiArt[name].ansi_file], { type: 'text/plain' })
        });
    } else if (type === 'code') {
        clipItem = new ClipboardItem({
            'text/plain': new Blob([`printf '%b\n' '${ansiArt[name].ansi_code}'`], { type: 'text/plain' })
        });
    }

    if (clipItem) {
        await navigator.clipboard.write([clipItem]);
        console.log('Copied');
    }
}

function displayMessage(type, message) {
    messageContainer.insertAdjacentHTML('beforeend', /*html*/`
        <span class="${type} new" onclick="this.remove()">${message}</span>
    `);
    setTimeout(() => { messageContainer.children[messageContainer.children.length - 1].classList.remove('new') }, 500);
}

const container = document.getElementById('art-container');
const creatorCanvas = document.querySelector('#section-creator canvas');
const messageContainer = document.querySelector('#messages');

let creatorImage;
let ansiArt = {};

document.fonts.ready.then(() => {
    requestAnimationFrame(async () => {
        fetch('./paths.json')
        .then(r => r.text())
        .then(text => {
            JSON.parse(text).forEach(async path => {
                ansiArt[path] = {};
                ansiArt[path]['image_path'] = `./ANSI Art/${path}/image.png`;
                let initial_width = 30;
                let ansi = await imageToAnsi(`./ANSI Art/${path}/image.png`, initial_width, undefined, true);
                ansiArt[path]['ansi_code'] = ansi;
                ansi = ansi.replaceAll('\\x1b', '');
                ansiArt[path]['ansi_file'] = ansi;

                let cvs = document.createElement('canvas');
                renderAnsi(cvs, ansi);

                container.insertAdjacentHTML('beforeend', /*html*/`
                <div data-name="${path}" tabindex="-1">
                    <div tabindex="-1">
                        <a class="download image" href="javascript:copyAs('image', '${path}')"></a>
                        <a class="download ansi" href="javascript:copyAs('ansi', '${path}')"></a>
                        <a class="download code" href="javascript:copyAs('code', '${path}')"></a>
                    </div>
                    <div tabindex="-1">
                        <a class="download image" href="javascript:downloadAs('image', '${path}')"></a>
                        <a class="download ansi" href="javascript:downloadAs('ansi', '${path}')"></a>
                        <a class="download code" href="javascript:downloadAs('code', '${path}')"></a>
                    </div>
                    <span data-width="${initial_width}">
                        <input type="range" list="art-width" value="30" min="15" max="75" 
                               oninput="this.parentElement.setAttribute('data-width', this.value);"
                               onchange="changeAnsi(this.parentElement.parentElement.getAttribute('data-name'), this.value)" />
                        <input type="color"
                               onchange="changeAnsi(this.parentElement.parentElement.getAttribute('data-name'), this.previousElementSibling.value, this.value)" />
                    </span>
                </div>`);
                container.lastElementChild.insertAdjacentElement('afterbegin', cvs);
            });
        })
    })
})

window.onscroll = function(e) {
    if (this.oldScroll > this.scrollY) {
        document.body.setAttribute('data-scroll', 'up')
    } else {
        if (this.scrollY > 30) {
            document.body.setAttribute('data-scroll', 'down')
        }
    }
    this.oldScroll = this.scrollY;
}
window.addEventListener('paste', (e) => {
  for (const item of e.clipboardData?.items ?? []) {
    if (!item.type.startsWith('image/')) continue;

    const image = item.getAsFile();
    createAnsi(image, 30);
    e.preventDefault();
    break;
  }
});
